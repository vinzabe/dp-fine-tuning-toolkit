name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests
      - name: mypy (strict)
        if: matrix.python-version == '3.12'
        run: mypy --strict src/dpft
      - name: tests + coverage
        run: pytest --cov=dpft --cov-report=term-missing --cov-fail-under=88

  demo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e .
      - name: empirical privacy audit must be consistent
        run: python -m dpft audit --n 120 --epochs 5 --noise 1.0 --trials 40
