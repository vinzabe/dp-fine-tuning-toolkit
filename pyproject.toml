[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dp-fine-tuning-toolkit"
version = "1.0.0"
description = "Differentially-private training with an empirical privacy audit: DP-SGD (per-example clipping + Gaussian noise), an RDP accountant for the subsampled Gaussian mechanism, and a membership-inference audit that empirically lower-bounds epsilon to validate the theoretical guarantee."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "vinzabe", email = "gabejar@usa.com" }]
keywords = ["privacy", "differential-privacy", "dp-sgd", "machine-learning", "membership-inference"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "hypothesis>=6", "mypy>=1.8", "ruff>=0.5"]

[project.scripts]
dpft = "dpft.cli:main"

[project.urls]
Homepage = "https://github.com/vinzabe/dp-fine-tuning-toolkit"
Issues = "https://github.com/vinzabe/dp-fine-tuning-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dpft"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["dpft"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "S101", "ARG001", "ARG002", "ARG005", "F841"]
